name: Build SkyGfxVC

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
    
    - name: Checkout plugin-sdk for RWSDK headers
      uses: actions/checkout@v6
      with:
        repository: DK22Pac/plugin-sdk
        path: plugin-sdk
        sparse-checkout: |
          plugin_vc/game_vc/rw
        sparse-checkout-cone-mode: false
    
    - name: Setup Environment
      run: |
        $rwsdkPath = Join-Path "${{ github.workspace }}" "plugin-sdk\plugin_vc\game_vc\rw"
        echo "RWSDK34=$rwsdkPath" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    
    - name: Build Solution
      run: |
        .\premake5.exe vs2022
      shell: cmd

    - name: List build directory
      run: dir build
      shell: cmd

    - name: MSBuild
      run: |
        msbuild build\skygfx_vc.sln /p:Configuration=Release /p:Platform=Win32 /m
      shell: cmd
    
    - name: Convert to ASI
      run: |
        Copy-Item "bin\Release\skygfx.dll" "bin\Release\skygfx.asi"
      shell: pwsh
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: SkyGfxVC
        path: bin/Release/skygfx.asi
